<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Notizen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notizen">
<meta name="theme-color" content="#f2f2ef">
<style>
:root{--bg:#f2f2ef;--panel:#ffffff;--text:#1d1d1f;--muted:#6b6b70;--border:#e0e0dc;--accent:#2f6fed;--accent-soft:#e6eefe;--hover:#ececea;--paper:#fcfcfa;--danger:#d93025;--shadow:0 1px 3px rgba(0,0,0,.08),0 6px 20px rgba(0,0,0,.07);--shadow-sm:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);--dot:#dcdcd6;--dash:#cfcfc8;--page:#fbfaf5;--page-edge:#d9d5ca;--label:#fbfaf6;--cover-shadow:0 1px 2px rgba(0,0,0,.16),0 14px 26px -10px rgba(0,0,0,.42);--cover-shadow-lift:0 2px 4px rgba(0,0,0,.14),0 22px 34px -12px rgba(0,0,0,.45);--c1:#5a8ae0;--c2:#2d55a8}
html.dark{--bg:#151618;--panel:#232427;--text:#ececec;--muted:#9a9aa0;--border:#36383c;--accent:#6b97ff;--accent-soft:#2a3550;--hover:#2f3135;--paper:#1c1d20;--danger:#ff6b5e;--shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.2);--dot:#3a3c41;--dash:#44464c;--page:#d9d6cc;--page-edge:#a9a59a;--label:#f1efe8;--cover-shadow:0 1px 2px rgba(0,0,0,.5),0 14px 28px -10px rgba(0,0,0,.75);--cover-shadow-lift:0 2px 4px rgba(0,0,0,.5),0 22px 36px -12px rgba(0,0,0,.8)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:10px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}
/* Startseite: Regal (Bücher) und Buch (Seiten) */
#home{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:background-color .25s}
#home.inbook{background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 11%,var(--bg)) 0,var(--bg) 300px)}
html.dark #home.inbook{background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 13%,var(--bg)) 0,var(--bg) 300px)}
#home header{display:flex;align-items:center;gap:12px 16px;padding:22px 36px 12px;flex-wrap:wrap}
#home .hl{display:flex;align-items:center;gap:14px;flex:1 1 230px;min-width:0}
#home .ttl{min-width:0}
#home h1{font-size:30px;font-weight:650;letter-spacing:-.015em;line-height:1.15;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#home .sub{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.hact{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
@media (max-width:1180px){#hDark span,#home .sub .opt{display:none}#hDark{padding:9px 12px}}
.seg{display:flex;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-sm)}
.seg .btn{background:none;border:0;box-shadow:none;border-radius:0}
.seg .btn:first-child{border-radius:11px 0 0 11px}
.seg .btn:last-child{border-radius:0 11px 11px 0}
.seg .btn+.btn{border-left:1px solid var(--border)}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:9px 15px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow-sm);border-radius:12px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 14px -4px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.primary.danger{background:var(--danger);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.rb{width:42px;height:42px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text)}
.rb:hover{background:var(--hover)}
.rb.back{background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.rb.back:hover{background:var(--hover)}
.mc{position:relative;flex:none;width:36px;height:48px;border-radius:2px 6px 6px 2px}
.mc .lbl{border-radius:2px;box-shadow:none}
.mc .pgs{right:-3px;width:10px;top:3px;bottom:3px;border-radius:0 4px 4px 0}
.mc .cover{box-shadow:0 1px 2px rgba(0,0,0,.22),0 4px 10px -3px rgba(0,0,0,.4)}
#home .trow{display:flex;align-items:center;gap:2px;min-width:0;margin:-4px 0}
#hBookMenu{margin:0}
#grid{flex:1;overflow:auto;padding:14px 36px 56px;display:grid;align-content:start;grid-auto-rows:max-content;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#grid.shelf{grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:40px 36px;padding-top:24px}
#grid.pages{grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:26px}
#grid.enter>*{animation:hIn .28s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i,0) * 16ms)}
@keyframes hIn{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){#grid.enter>*{animation:none}.book .cv,.card{transition:none!important}}
/* Buchdeckel */
.book{display:flex;flex-direction:column;gap:13px;min-width:0}
.book .cv{position:relative;display:block;flex:none;width:100%;aspect-ratio:3/4;padding:0;border-radius:4px 12px 12px 4px;transition:transform .2s cubic-bezier(.2,.7,.3,1)}
.book .cv:hover{transform:translateY(-5px)}
.book .cv:active{transform:translateY(-2px) scale(.985)}
.book .cv:hover .cover{box-shadow:var(--cover-shadow-lift)}
.book .cv:focus-visible{outline:none}
.book .cv:focus-visible .cover,.addtile:focus-visible,.btn:focus-visible,.rb:focus-visible,.mbtn:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:3px}
.pgs{position:absolute;top:2.2%;bottom:2.2%;right:-5px;width:30px;border-radius:0 8px 8px 0;background:repeating-linear-gradient(90deg,var(--page) 0 1.5px,var(--page-edge) 1.5px 2.5px);box-shadow:0 1px 2px rgba(0,0,0,.14),0 8px 16px -8px rgba(0,0,0,.35)}
.cover{position:absolute;inset:0;border-radius:inherit;overflow:hidden;container-type:inline-size;background:radial-gradient(130% 75% at 22% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 62%),linear-gradient(165deg,var(--c1),var(--c2));box-shadow:var(--cover-shadow);transition:box-shadow .2s}
.cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:13%;background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,.17) 72%,rgba(0,0,0,.26));box-shadow:inset -1px 0 0 rgba(255,255,255,.16),1px 0 4px rgba(0,0,0,.22)}
.cover::after{content:'';position:absolute;top:0;bottom:0;right:9%;width:4.6%;background:linear-gradient(90deg,rgba(0,0,0,.40),rgba(24,24,28,.62) 50%,rgba(0,0,0,.40));box-shadow:-1px 0 3px rgba(0,0,0,.18),1px 0 3px rgba(0,0,0,.18)}
.cover .gl{position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.22);pointer-events:none}
.cover .lbl{position:absolute;left:17%;right:17%;top:17%;padding:5.5cqw 4.3cqw 6cqw;background:var(--label);border-radius:3.6cqw;color:#2a2a2e;font-weight:650;font-size:calc(8.6cqw * var(--k,1));line-height:1.25;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.05)}
.cover .lbl .t{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cover .lbl::after{content:'';display:block;height:max(1.5px,1.1cqw);width:34%;margin:3.6cqw auto 0;border-radius:2px;background:var(--c1);opacity:.75}
.book .cap{display:flex;align-items:flex-start;gap:2px;padding-left:2px}
.book .cap .grow,.card .grow{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.mbtn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:var(--muted);margin:-6px -8px 0 0}
.mbtn:hover,.mbtn.on{background:var(--hover);color:var(--text)}
.mbtn svg{width:20px;height:20px}
/* Seiten */
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card:active{transform:translateY(-1px) scale(.99)}
.card .th{position:relative;flex:none;aspect-ratio:4/3;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:14px 14px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--border)}
.card .th img{width:100%;height:100%;object-fit:cover}
.card .th.bg-grid{background-image:linear-gradient(var(--dot) 1px,transparent 1px),linear-gradient(90deg,var(--dot) 1px,transparent 1px)}
.card .th.bg-lines{background-image:linear-gradient(transparent 16px,var(--dot) 16px,var(--dot) 17px,transparent 17px);background-size:100% 17px}
.card .th.bg-blank{background-image:none}
.card .pno{position:absolute;left:10px;bottom:9px;min-width:24px;height:22px;padding:0 7px;border-radius:11px;background:color-mix(in srgb,var(--panel) 88%,transparent);box-shadow:0 0 0 1px var(--border);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.card .meta{flex:none;display:flex;align-items:center;gap:4px;min-height:62px;padding:10px 10px 10px 15px}
.card .meta .mbtn{margin:0 -2px 0 0}
/* Plus-Kachel */
.addtile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:2px dashed var(--dash);border-radius:12px 12px 12px 12px;color:var(--muted);font-weight:600;transition:border-color .15s,color .15s,background-color .15s}
.addtile:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.addtile .plus{width:46px;height:46px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.addtile.bk{aspect-ratio:3/4;border-radius:5px 13px 13px 5px}
.addtile.pg{border-radius:14px;min-height:calc(100% - 0px)}
.addtile.pg::before{content:'';display:block;flex:none;width:100%;aspect-ratio:4/3;margin-bottom:58px;order:-1}
.addtile.pg>*{position:absolute}
.addtile.pg .plus{top:calc(50% - 38px)}
.addtile.pg span{top:calc(50% + 18px)}
/* Leerer Zustand */
.empty{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:70px 20px 40px;color:var(--muted)}
.empty h2{margin:28px 0 6px;font-size:22px;font-weight:650;color:var(--text)}
.empty p{margin:0 0 22px;max-width:420px;line-height:1.5}
.ill{position:relative;width:200px;height:150px}
.ill .mini{position:absolute;bottom:0;width:84px;height:112px;border-radius:3px 9px 9px 3px;background:radial-gradient(130% 75% at 22% 0%,rgba(255,255,255,.24),rgba(255,255,255,0) 62%),linear-gradient(165deg,var(--c1),var(--c2));box-shadow:0 10px 22px -8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.08)}
.ill .mini::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:3px 0 0 3px;background:rgba(0,0,0,.24)}
.ill .mini::after{content:'';position:absolute;top:0;bottom:0;right:9px;width:4px;background:rgba(0,0,0,.4)}
.ill .mini:nth-child(1){left:8px;transform:rotate(-9deg);transform-origin:bottom right}
.ill .mini:nth-child(2){left:58px;z-index:1;height:124px}
.ill .mini:nth-child(3){left:108px;transform:rotate(8deg);transform-origin:bottom left}
.ill .sheet{position:absolute;left:38px;top:8px;width:124px;height:142px;border-radius:10px;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.4px);background-size:14px 14px;background-position:3px 3px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 12px 26px -10px rgba(0,0,0,.35);border:1px solid var(--border)}
.ill .sheet.back{transform:rotate(-7deg) translate(-10px,4px);opacity:.75}
.ill .sheet i{position:absolute;left:18px;right:30px;height:3px;border-radius:2px;background:var(--c1);opacity:.85}
#empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:80px 20px}
/* Menüs der Startseite */
#homeMenu{max-height:min(480px,calc(100vh - 24px));overflow:auto;min-width:250px;max-width:min(340px,calc(100vw - 16px))}
#homeMenu svg.i{width:19px;height:19px;color:var(--muted);flex:none}
#homeMenu .del,#homeMenu .del svg.i{color:var(--danger)}
#homeMenu .head{font-size:13px;color:var(--muted);font-weight:600}
#homeMenu .chip{flex:none;width:16px;height:21px;border-radius:2px 4px 4px 2px;background:linear-gradient(160deg,var(--c1),var(--c2));box-shadow:inset 3px 0 0 rgba(0,0,0,.2)}
#homeMenu .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#homeMenu .sub{margin-left:auto;padding-left:10px;font-size:12.5px;color:var(--muted)}
/* Editor */
#editor{position:fixed;inset:0;touch-action:none}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#penDot{position:absolute;left:0;top:0;display:none;border-radius:50%;opacity:.5;pointer-events:none}
#bar{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);z-index:5;flex-wrap:wrap}
.tb{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--text)}
.tb:hover{background:var(--hover)}
.tb.on{background:var(--accent-soft);color:var(--accent)}
.tb:disabled{opacity:.35;cursor:default;background:none}
.sep{width:1px;height:28px;background:var(--border);margin:0 4px}
#title{field-sizing:content;min-width:90px;max-width:280px;font:inherit;font-weight:600;color:var(--text);background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 8px;-webkit-user-select:text;user-select:text}
#title:hover,#title:focus{border-color:var(--border);outline:none}
@media (max-width:1500px){#bar{gap:4px}.sep{margin:0 2px}#title{max-width:180px;text-overflow:ellipsis}}  /* bleibt bei ~1440 px einzeilig */
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--border);margin:0 2px;padding:0;position:relative}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.sw.custom{background:conic-gradient(#e53935,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.sz{width:34px;height:40px;display:flex;align-items:center;justify-content:center}
.sz span{display:block;border-radius:50%;background:var(--text)}
.sz:hover{background:var(--hover)}
.sz.on{background:var(--accent-soft)}
.sz.on span{background:var(--accent)}
#sizeMenu{min-width:0;width:280px;padding:12px 16px 14px}
#sizeMenu .szhead{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--muted)}
#sizeMenu .szhead b{color:var(--text);font-size:16px;font-variant-numeric:tabular-nums}
#szRange{display:block;width:100%;height:32px;margin:6px 0;accent-color:var(--accent);touch-action:none}
#sizeMenu .szprev{height:84px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--paper)}
#szDot{display:block;width:180px;border-radius:999px}
.grow{flex:1}
#zoom{min-width:58px;height:40px;padding:0 8px;font-variant-numeric:tabular-nums;color:var(--muted)}
#zoom:hover{background:var(--hover)}
.menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:220px}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px}
.menu button:hover{background:var(--hover)}
.menu button.on{color:var(--accent);font-weight:600}
.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
#selbar{position:absolute;z-index:6;display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);transform:translateX(-50%)}
#selbar button{padding:8px 12px;font-size:14px}
#selbar button:hover{background:var(--hover)}
#selbar .del{color:var(--danger)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:50;box-shadow:var(--shadow);font-size:14px;transition:opacity .2s;pointer-events:none;max-width:90vw}
html.dark #toast{background:#eee;color:#111}
#dlg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
#dlgBox{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px;width:min(420px,90vw);display:flex;flex-direction:column;gap:14px}
#dlgIn{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;-webkit-user-select:text;user-select:text}
#dlgIn:focus{outline:2px solid var(--accent);outline-offset:-1px}
#dlg .row{display:flex;justify-content:flex-end;gap:8px}
/* Formen */
#shapeMenu{width:436px;max-width:calc(100vw - 16px);padding:10px 10px 8px}
#shapeMenu .mh{font-size:12px;font-weight:600;color:var(--muted);padding:2px 8px 6px;text-transform:uppercase;letter-spacing:.06em}
#shapeMenu .shg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px}
#shapeMenu .shg.g3{grid-template-columns:repeat(3,1fr)}
#shapeMenu .shg button{flex-direction:column;justify-content:flex-start;align-items:center;gap:6px;padding:10px 4px 9px;min-height:78px;text-align:center;font-size:12.5px;line-height:1.25;border-radius:11px}
#shapeMenu .shg button svg{width:30px;height:30px;stroke-width:1.6;flex:none}
#shapeMenu .shg.g3 button svg{width:36px;height:36px;stroke-width:1.45}
#shapeMenu .shg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#shapeMenu .mhint{font-size:12px;color:var(--muted);padding:8px 8px 2px;border-top:1px solid var(--border)}
#shapeMenu{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
/* Eigene Formen: Kacheln mit Vorschaubild, Name und Löschknopf; viele Formen scrollen im Raster */
#shapeMenu .cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px;max-height:246px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
#shapeMenu .ct{position:relative;min-width:0}
#shapeMenu .cpick{flex-direction:column;justify-content:flex-start;align-items:center;gap:6px;padding:9px 6px 8px;text-align:center;font-size:12.5px;line-height:1.25;border-radius:11px;min-width:0}
#shapeMenu .cth{display:block;flex:none;width:60px;height:60px;padding:1px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--border)}
#shapeMenu .cth canvas{display:block;width:56px;height:56px;margin:1px}
#shapeMenu .cn{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#shapeMenu .cpick.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
#shapeMenu .cpick.on .cth{box-shadow:inset 0 0 0 2px var(--accent)}
#shapeMenu .cdel{position:absolute;top:3px;right:5px;width:24px;height:24px;padding:0;justify-content:center;border-radius:50%;background:var(--panel);color:var(--muted);box-shadow:0 0 0 1px var(--border),0 1px 3px rgba(0,0,0,.12);opacity:.8}
#shapeMenu .cdel::after{content:'';position:absolute;inset:-8px}
#shapeMenu .cdel svg{width:14px;height:14px;stroke-width:2.3}

<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));

/* ---------- Zustand ---------- */
const PALETTE = ['ink', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa'];
// Strichstärken in Weltkoordinaten: ein Strich ist bei jedem Zoom gleich dick wie die anderen.
// Die Voreinstellungen lassen sich per Schieberegler ändern (aktive Dicke nochmal antippen).
const SIZES = { pen: [1, 2, 3.5, 6, 10], hl: [8, 14, 22, 32] };
const SIZE_DEFAULT = { pen: 2, hl: 1 };
const SIZE_RANGE = { pen: [0.5, 30], hl: [4, 80] };
const HL_ALPHA = { light: 0.42, dark: 0.45 };
const S = {
  note: null,          // Eintrag aus dem Index (Name, Ansicht, Hintergrund, Vorschaubild)
  items: [],           // Striche und Bilder der offenen Notiz, in Zeichenreihenfolge
  saved: new Map(),    // id -> Objekt, so wie es zuletzt gespeichert wurde
  view: { tx: 0, ty: 0, z: 1 },
  level: 1,            // Zoomstufe, in der die Kacheln gerendert werden
  tool: 'pen', color: { pen: 'ink', hl: '#fdd835' }, size: {}, presets: {}, sizeIdx: {},
  sel: null, undo: [], redo: [], fingerDraw: false, dark: false,
  busy: 0, thumbDirty: false,
  shape: 'rect',       // gewählte Form des Formen-Werkzeugs
  snap: false,         // Am Raster ausrichten
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('notizen.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('notizen.' + k, JSON.stringify(v)); } catch (e) {} },
};
S.dark = store.get('dark', matchMedia('(prefers-color-scheme: dark)').matches);
S.fingerDraw = store.get('fingerDraw', false);
S.snap = store.get('snap', false) === true;
Object.assign(S.color, store.get('color', {}));
{
  const pre = store.get('presets', {}), idx = store.get('sizeIdx', {}), old = store.get('size', {});
  for (const k of ['pen', 'hl']) {
    const [lo, hi] = SIZE_RANGE[k], p = pre[k];
    const ps = S.presets[k] = Array.isArray(p) && p.length === SIZES[k].length && p.every(v => typeof v === 'number' && v >= lo && v <= hi) ? p : [...SIZES[k]];
    let i = idx[k];
    if (!(Number.isInteger(i) && i >= 0 && i < ps.length)) {
      i = SIZE_DEFAULT[k];
      if (typeof old[k] === 'number') ps.forEach((v, j) => { if (Math.abs(v - old[k]) < Math.abs(ps[i] - old[k])) i = j; });   // Wert aus Version 1.2
    }
    S.sizeIdx[k] = i; S.size[k] = ps[i];
  }
}

// iPad/iPhone (iPadOS meldet sich als Mac mit Touch)
const IOS = /iP(ad|hone|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function colorOf(c) { return c === 'ink' ? (S.dark ? '#f1f1f1' : '#1b1b1d') : c; }
function paperColor() { return S.dark ? '#1c1d20' : '#fcfcfa'; }
function patternColor() { return S.dark ? '#43464c' : '#c9c9c4'; }
function hlAlpha() { return S.dark ? HL_ALPHA.dark : HL_ALPHA.light; }

/* ---------- Hinweis ---------- */
let toastT;
function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastT); if (ms) toastT = setTimeout(() => t.style.opacity = 0, ms);
}

/* ---------- Speicher (IndexedDB) ----------
   index:  ein kleiner Eintrag pro Notiz (Name, Datum, Vorschaubild, Ansicht, Hintergrund)
   items:  jeder Strich und jedes Bild als eigener Datensatz, Schlüssel [Notiz, id]
   images: die Bilddaten (Blob) einmal pro Bild, dazu eine kleine Vorschau
   books:  die Bücher (Name, Farbe); jede Notiz (Seite) gehört über meta.book zu einem Buch
   shapes: eigene Formen (gespeicherte Striche), für alle Bücher und Seiten gleich */
let db = null;
function reqP(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function txDone(tx) {
  return new Promise((res, rej) => {
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error || new Error('Speicherfehler'));
    tx.onabort = () => rej(tx.error || new Error('Speichern abgebrochen (Speicher voll?)'));
  });
}
function dataURLToBlob(s) {
  const i = s.indexOf(','), head = s.slice(0, i), body = s.slice(i + 1);
  const mime = (head.match(/data:([^;,]+)/) || [])[1] || 'application/octet-stream';
  if (!/;base64/.test(head)) return new Blob([decodeURIComponent(body)], { type: mime });
  const bin = atob(body), u = new Uint8Array(bin.length);
  for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
  return new Blob([u], { type: mime });
}
// Notiz aus Version 1 (alles in einem Datensatz, Bilder als Data-URL) in die neue Form bringen
function legacyToRecords(n) {
  const id = n.id || uid();
  const meta = { id, name: n.name || 'Notiz', created: n.created || n.updated || Date.now(), updated: n.updated || Date.now(),
    thumb: n.thumb || null, bg: n.bg || 'dots', view: n.view || { tx: 0, ty: 0, z: 1 } };
  const items = [], images = [], bySrc = new Map();
  (n.items || []).forEach((it, k) => {
    if (it.t === 's' && it.pts) items.push({ ...it, pts: Float32Array.from(it.pts), o: k, n: id });
    else if (it.t === 'i' && it.src) {
      let img = bySrc.get(it.src);
      if (!img) { img = uid(); bySrc.set(it.src, img); images.push({ id: img, n: id, blob: dataURLToBlob(it.src), low: null, w: 0, h: 0 }); }
      const { src, ...rest } = it; items.push({ ...rest, img, o: k, n: id });
    }
  });

const BOOK_COLORS = {
  blue: ['Blau', '#5b8ce2', '#2b53a6'], red: ['Rot', '#dc5f55', '#a3302d'], green: ['Grün', '#4fa072', '#276445'],
  orange: ['Orange', '#ef9446', '#bf5d1d'], purple: ['Lila', '#9270d3', '#5b3c98'], teal: ['Petrol', '#3a98a0', '#1a5c66'],
  pink: ['Rosa', '#ea8aac', '#b9547e'], graphite: ['Graphit', '#6a7079', '#33373e'], mustard: ['Senf', '#e2b445', '#a87b12'],

async function ensureBooks() {
  try { return await ensureBooksTx(); }
  catch (e) {
    // Schreiben geht nicht (z. B. Speicher voll): nur lesen und Seiten ohne Buch vorläufig im Standardbuch zeigen
    const books = await reqP(db.transaction('books').objectStore('books').getAll()), notes = await dbIndexAll();
    const ids = new Set(books.map(b => b.id)), orphans = notes.filter(n => !ids.has(n.book));
    if (orphans.length) {
      let def = books.filter(b => b.name === DEFAULT_BOOK).sort(byCreated)[0];
      if (!def) { def = { id: 'standard', name: DEFAULT_BOOK, color: 'blue', created: 0 }; books.push(def); }
      for (const n of orphans) n.book = def.id;
    }
    return { books, notes };
  }
}

  return new Promise((res, rej) => {
    const tx = db.transaction(['books', 'index'], 'readwrite'), bs = tx.objectStore('books'), is = tx.objectStore('index');
    const out = { books: null, notes: null };
    const step = () => {
      if (!out.books || !out.notes) return;
      const ids = new Set(out.books.map(b => b.id)), orphans = out.notes.filter(n => !ids.has(n.book));
      if (!orphans.length) return;
      let def = out.books.filter(b => b.name === DEFAULT_BOOK).sort(byCreated)[0];
      if (!def) { def = { id: uid(), name: DEFAULT_BOOK, color: 'blue', created: Date.now() }; bs.put(def); out.books.push(def); }
      for (const n of orphans) { n.book = def.id; is.put(n); }
    };
    bs.getAll().onsuccess = e => { out.books = e.target.result; step(); };
    is.getAll().onsuccess = e => { out.notes = e.target.result; step(); };
    txDone(tx).then(() => res(out), rej);

}

/* ---------- Bilder & PDF ---------- */
let importChain = Promise.resolve();
function queueImport(fn) {
  S.busy++;
  const run = importChain.then(fn).catch(err => { console.error(err); toast('Import fehlgeschlagen: ' + (err.message || err), 5000); })
    .finally(() => { S.busy--; });
  importChain = run;
  return run;
}
function viewCenterWorld() { const top = barBottom(); return toWorld(VW / 2, top + (VH - top) / 2); }
// nicht exakt über einen vorherigen Import legen (mit Raster: obere linke Ecke auf einen Rasterpunkt)
function freeSpot(x, y, w) {
  const G = gridSize();
  if (S.snap) x = snapG(x);
  for (let k = 0; k < 50; k++) {
    if (!S.items.some(it => it.t === 'i' && Math.abs(it.x - x) < 1 && Math.abs(it.y - y) < 1)) return x;
    x += w + 40 / S.view.z; if (S.snap) x = Math.ceil(x / G) * G;
  }
  return x;
}
async function prepareImage(file) {
  const bmp = await decodeBlob(file);
  const w0 = bmp.width, h0 = bmp.height;
  const s = Math.min(1, Math.sqrt(16e6 / (w0 * h0)), 8192 / Math.max(w0, h0));
  let blob = file, w = w0, h = h0;
  const keep = /^image\/(jpeg|png|webp)$/.test(file.type) && s === 1;
  if (!keep) {
    w = Math.max(1, Math.round(w0 * s)); h = Math.max(1, Math.round(h0 * s));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, w, h);
    blob = await canvasToBlob(c, file.type === 'image/jpeg' ? 'image/jpeg' : 'image/webp', 0.92);
    c.width = c.height = 0;
  }
  const low = await makeLow(bmp, blob.type); bmp.close();
  return { blob, low, w, h };
}
function insertImages(files) {
  const list = [...files].filter(f => f.type.startsWith('image/'));
  if (!list.length || !S.note) return;
  const note = S.note;
  return queueImport(async () => {
    toast('Bild wird eingefügt …', 0);
    const [cx, cy] = viewCenterWorld(), added = [];
    let off = 0;
    for (const f of list) {
      try {
        const { blob, low, w, h } = await prepareImage(f);
        const imgId = uid();
        await dbImagePut({ id: imgId, n: note.id, blob, low, w, h });
        const sw = Math.min(w / DPR, VW * 0.5, (VH * 0.6) * w / h), ww = sw / S.view.z, hh = ww * h / w;
        const y = S.snap ? snapG(cy - hh / 2 + off) : cy - hh / 2 + off, x = freeSpot(cx - ww / 2 + off, y, ww);
        added.push({ t: 'i', id: uid(), img: imgId, x, y, w: ww, h: hh });
        off += 30 / S.view.z;
      } catch (e) { toast('„' + f.name + '“ kann nicht geöffnet werden (Format nicht unterstützt?)', 4500); await new Promise(r => setTimeout(r, 1200)); }
    }
    if (added.length && S.note === note) {
      commit(withImages(S.items, added)); setTool('lasso'); setSel(new Set(added.map(a => a.id)));
      toast('Eingefügt. Zum Verschieben ziehen, über den blauen Punkt skalieren.', 3000);
    }
  });
}
let pdfWorker = null;
function getPdfWorker() {
  if (pdfWorker) return pdfWorker;
  const url = URL.createObjectURL(new Blob([$('#pdfWorkerSrc').textContent], { type: 'text/javascript' }));
  pdfjsLib.GlobalWorkerOptions.workerSrc = url;
  try { pdfWorker = new pdfjsLib.PDFWorker({ port: new Worker(url) }); } catch (e) { pdfWorker = null; }
  return pdfWorker;
}
function insertPdf(file) {
  if (!S.note) return;
  const note = S.note;
  return queueImport(async () => {
    toast('PDF wird geladen …', 0);
    const worker = getPdfWorker();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), ...(worker ? { worker } : {}) }).promise;
    const added = [], failed = [];
    try {
      const [cx] = viewCenterWorld(), [, y0] = toWorld(0, barBottom() + 30);
      let y = S.snap ? snapG(y0) : y0, x = null;
      for (let i = 1; i <= pdf.numPages; i++) {
        toast(`PDF-Seite ${i} von ${pdf.numPages} …`, 0);
        try {
          const page = await pdf.getPage(i), vp1 = page.getViewport({ scale: 1 });
          const w = vp1.width * 1.3, h = vp1.height * 1.3;
          // etwa doppelte Bildschirmauflösung bei 100 %, höchstens ~10 Mio. Pixel
          let scale = clamp(w * 2.2 / vp1.width, 0.5, 4);
          scale = Math.min(scale, Math.sqrt(10e6 / (vp1.width * vp1.height)));
          const vp = page.getViewport({ scale });
          const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
          await page.render({ canvasContext: g, viewport: vp }).promise;
          const blob = await canvasToBlob(c, 'image/jpeg', 0.9);
          const low = await makeLow(c, 'image/jpeg');
          const pw = c.width, ph = c.height; c.width = c.height = 0;
          const imgId = uid();
          await dbImagePut({ id: imgId, n: note.id, blob, low, w: pw, h: ph });
          if (x === null) x = freeSpot(cx - w / 2, y, w);
          added.push({ t: 'i', id: uid(), img: imgId, x, y, w, h, pdf: file.name, page: i });
          y += h + 30; if (S.snap) y = Math.ceil(y / gridSize()) * gridSize();
          page.cleanup();
        } catch (err) { console.error(err); failed.push(i); }
        await nextFrame();
      }
    } finally { pdf.destroy(); }
    if (added.length && S.note === note) commit(withImages(S.items, added));
    toast(`${added.length} Seite${added.length === 1 ? '' : 'n'} eingefügt` + (failed.length ? `, Seite ${failed.join(', ')} fehlerhaft` : ''), 3500);
  });
}

/* ---------- Export ---------- */
async function renderTo(items, box, scale, bg, cheap) {
  const [x0, y0, x1, y1] = box, W = Math.max(1, Math.ceil((x1 - x0) * scale)), H = Math.max(1, Math.ceil((y1 - y0) * scale));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = paperColor(); ctx.fillRect(0, 0, W, H);
  drawBg(ctx, bg, { tx: -x0 * scale, ty: -y0 * scale, z: scale }, W / 1, H / 1, 1);
  ctx.setTransform(scale, 0, 0, scale, -x0 * scale, -y0 * scale);
  for (const it of items) {
    if (it.t === 'i') {
      const e = imgEntry(it.img); await e.ready;
      // Export: jedes Bild einzeln in voller Auflösung dekodieren und gleich wieder freigeben
      const bmp = !cheap && e.rec ? await decodeBlob(e.rec.blob).catch(() => null) : null;
      const use = bmp || e.low;
      if (use) { ctx.imageSmoothingQuality = 'high'; ctx.drawImage(use, it.x, it.y, it.w, it.h); }
      if (bmp) bmp.close();
    } else if (cheap) {
      // Vorschaubild: Striche als einfache Linien (schnell)
      ctx.strokeStyle = colorOf(it.c); ctx.lineWidth = it.w; ctx.lineCap = ctx.lineJoin = 'round';
      if (it.hl) { ctx.globalAlpha = hlAlpha(); if (!S.dark) ctx.globalCompositeOperation = 'multiply'; }
      ctx.beginPath(); ctx.moveTo(it.pts[0], it.pts[1]);
      const step = Math.max(3, Math.floor(it.pts.length / 3 / 20) * 3);
      for (let i = step; i < it.pts.length; i += step) ctx.lineTo(it.pts[i], it.pts[i + 1]);
      ctx.lineTo(it.pts[it.pts.length - 3], it.pts[it.pts.length - 2]); ctx.stroke();
      ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    } else drawItem(ctx, it, scale);
  }
  return c;
}
async function exportPNG() {
  const b = contentBox(); if (!b) { toast('Die Seite ist noch leer'); return; }
  const pad = 40, box = [b[0] - pad, b[1] - pad, b[2] + pad, b[3] + pad];
  const bw = box[2] - box[0], bh = box[3] - box[1];
  const scale = Math.min(2, 16000 / Math.max(bw, bh), Math.sqrt(120e6 / (bw * bh)));
  toast('Bild wird erstellt …', 0);
  try {
    const c = await renderTo(S.items, box, scale, S.note.bg || 'dots');
    const blob = await canvasToBlob(c, 'image/png'); c.width = c.height = 0;
    download(blob, (S.note.name || 'Notiz') + '.png'); toast('Bild gespeichert');
  } catch (e) { toast('Export fehlgeschlagen: ' + e.message, 5000); }
}
async function download(blob, name) {
  name = name.replace(/[\\/:*?"<>|]/g, '_');
  // iPad: über das Teilen-Menü (In Dateien sichern, AirDrop, Mail …), ein Download ist dort schlecht auffindbar
  if (IOS && navigator.canShare) {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; }

// Eigener Dialog, weil prompt/confirm in Electron nicht gehen.
// o: { value, input (false = nur Ja/Nein), ok (Beschriftung), danger, color (Buch-Dialog mit Farbwahl und Vorschau) }
function dialog(msg, o = {}) {
  return new Promise(res => {
    const d = $('#dlg'), box = $('#dlgBox'), inp = $('#dlgIn'), ok = $('#dlgOk'), sw = $('#dlgSw'), prev = $('#dlgPrev');
    const withInput = o.input !== false, bk = !!o.color;
    let color = o.color;
    const ae = document.activeElement; if (ae && ae.blur) ae.blur();
    $('#dlgMsg').textContent = msg; inp.classList.toggle('hidden', !withInput); inp.value = o.value || '';
    inp.placeholder = o.placeholder || '';
    ok.textContent = o.ok || 'OK'; ok.classList.toggle('danger', !!o.danger);
    box.classList.toggle('bk', bk); sw.classList.toggle('hidden', !bk); prev.classList.toggle('hidden', !bk);
    sw.innerHTML = ''; inp.oninput = null;
    if (bk) {
      const upd = () => { coverVars(prev, color); coverLabel(prev.querySelector('.lbl'), inp.value.trim() || o.placeholder || '', 5.3); };
      for (const [k, [label]] of Object.entries(BOOK_COLORS)) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'bsw' + (k === color ? ' on' : ''); b.title = label; b.dataset.c = k;
        coverVars(b, k);
        b.onclick = () => { color = k; sw.querySelectorAll('.bsw').forEach(x => x.classList.toggle('on', x === b)); upd(); };
        sw.appendChild(b);
      }
      inp.oninput = upd; upd();
    }
    d.classList.remove('hidden');
    if (withInput) { inp.focus(); inp.select(); } else ok.focus();
    const done = v => { d.classList.add('hidden'); box.onsubmit = $('#dlgNo').onclick = d.onpointerdown = inp.oninput = null; res(v); };
    box.onsubmit = e => { e.preventDefault(); done(!withInput ? true : bk ? { name: inp.value, color } : inp.value); };
    $('#dlgNo').onclick = () => done(null);
    d.onpointerdown = e => { if (e.target === d) done(null); };
  });
}

// Beschriftung auf dem Einband: die Schrift wächst mit dem Einband (cqw); lange Wörter werden kleiner gesetzt,
// damit sie nicht mitten im Wort umbrechen. avail = nutzbare Breite des Schildes in em.
let measureCtx = null;
function coverLabel(lbl, name, avail = 6.7) {
  lbl.firstChild.textContent = name;
  if (!measureCtx) measureCtx = document.createElement('canvas').getContext('2d');
  measureCtx.font = '650 100px ' + getComputedStyle(document.body).fontFamily;
  const em = t => measureCtx.measureText(t).width / 100;
  const longest = Math.max(0, ...name.split(/\s+/).map(em)), total = em(name);
  avail *= 0.93;   // Reserve: Kerning und Schriftersatz messen nicht exakt
  let k = longest > avail ? avail / longest : 1;
  if (total > 2.2 * avail) k = Math.min(k, 0.82);   // lange Namen: lieber kleiner als abgeschnitten
  lbl.style.setProperty('--k', Math.max(0.55, k).toFixed(3));
}

   Format 3: Kopfzeile, dann {k:'book'} je Buch, {k:'shape'} je eigene Form, dann je Notiz {k:'note'} (mit book),
   {k:'items'}, {k:'img'}. */
function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
$('#hBackup').onclick = async () => {
  if (navBusy) return;
  try {
    const { books, notes: metas } = await ensureBooks(), shapes = (await dbShapesAll()).sort(byCreated);
    if (!metas.length && !books.length && !shapes.length) { toast('Es gibt noch nichts zu sichern'); return; }
    toast('Sicherung wird erstellt …', 0);
    const parts = [JSON.stringify({ app: 'notizen', format: 3, saved: Date.now() }) + '\n'];
    for (const b of books.sort(byCreated)) parts.push(JSON.stringify({ k: 'book', ...b }) + '\n');
    for (const r of shapes) parts.push(JSON.stringify({ k: 'shape', ...r, strokes: r.strokes.map(st => ({ ...st, pts: Array.from(st.pts, v => Math.round(v * 100) / 100) })) }) + '\n');
    for (const m of metas) {
      parts.push(JSON.stringify({ k: 'note', ...m }) + '\n');
      const items = (await dbItems(m.id)).map(it => it.t === 's' ? { ...it, pts: Array.from(it.pts, v => Math.round(v * 100) / 100) } : it);
      parts.push(JSON.stringify({ k: 'items', n: m.id, items }) + '\n');
      const imgs = await reqP(db.transaction('images').objectStore('images').index('n').getAll(m.id));
      for (const im of imgs) parts.push(JSON.stringify({ k: 'img', id: im.id, n: im.n, w: im.w, h: im.h, data: await blobToDataURL(im.blob) }) + '\n');
    }
    download(new Blob(parts, { type: 'application/x-ndjson' }), 'Notizen-Sicherung-' + new Date().toISOString().slice(0, 10) + '.notizen');
    const what = [metas.length || books.length ? booksWord(books.length) + ' mit ' + pagesWord(metas.length) : '', shapes.length ? shapesWord(shapes.length) : ''];
    toast(what.filter(Boolean).join(' und ') + ' gesichert');
  } catch (e) { toast('Sicherung fehlgeschlagen: ' + e.message, 6000); }
};
async function* fileLines(file) {
  const reader = file.stream().pipeThrough(new TextDecoderStream()).getReader();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += value; let i;
    while ((i = buf.indexOf('\n')) >= 0) { const line = buf.slice(0, i); buf = buf.slice(i + 1); if (line.trim()) yield line; }
  }
  if (buf.trim()) yield buf;
}
// Eigene Form aus einer Sicherung prüfen und in die gespeicherte Form bringen (Punkte als Float32Array)
function shapeFromBackup(r) {
  if (typeof r.id !== 'string' || !r.id || !Array.isArray(r.strokes)) return null;
  const strokes = r.strokes.filter(st => st && Array.isArray(st.pts) && st.pts.length >= 3 && st.pts.length % 3 === 0 && st.pts.every(Number.isFinite))
    .map(st => ({ c: typeof st.c === 'string' ? st.c : 'ink', w: st.w > 0 ? +st.w : 2, hl: !!st.hl, pts: Float32Array.from(st.pts) }));
  if (!strokes.length) return null;
  const [x0, y0] = geoBox(strokes);
  if (x0 || y0) for (const st of strokes) for (let i = 0; i < st.pts.length; i += 3) { st.pts[i] -= x0; st.pts[i + 1] -= y0; }
  const b = geoBox(strokes);
  return { id: r.id, name: String(r.name || 'Form').slice(0, 80), created: +r.created || Date.now(), w: b[2], h: b[3], strokes };
}
async function writeRecords(meta, items, images, replace) {
  const tx = db.transaction(['index', 'items', 'images'], 'readwrite');
  const its = tx.objectStore('items');
  if (replace) its.delete(IDBKeyRange.bound([meta.id], [meta.id, []]));   // vor dem Schreiben, in derselben Transaktion
  if (meta) tx.objectStore('index').put(meta);
  for (const it of items || []) its.put(it);
  for (const im of images || []) tx.objectStore('images').put(im);
  return txDone(tx);
}
if (IOS) $('#fRestore').removeAttribute('accept');   // iPadOS kennt .notizen nicht und würde die Sicherungen ausgrauen
$('#hRestore').onclick = () => $('#fRestore').click();
$('#fRestore').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || navBusy) return;
  navBusy = true; toast('Sicherung wird geladen …', 0);
  let count = 0, same = 0, books = 0, shapes = 0;
  try {
    const noteMap = new Map(), imgMap = new Map();
    const mapImg = (n, id) => { if (!noteMap.get(n)?.copy) return id; if (!imgMap.has(id)) imgMap.set(id, uid()); return imgMap.get(id); };
    let first = true;
    for await (const line of fileLines(f)) {
      const r = JSON.parse(line);
      if (first) {
        first = false;
        if (Array.isArray(r.notes)) {          // alte Sicherung (Version 1)
          for (const n of r.notes) { const { meta, items, images } = legacyToRecords(n); const ex = await dbIndexGet(meta.id); if (ex && ex.updated > meta.updated) { meta.id = uid(); meta.name += ' (Sicherung)'; items.forEach(i => i.n = meta.id); images.forEach(i => i.n = meta.id); } await writeRecords(meta, items, images, true); count++; }
          break;
        }
        if (r.app !== 'notizen') throw new Error('keine Notizen-Sicherung');
        continue;
      }
      if (r.k === 'book') {
        const { k, ...bk } = r;
        if (typeof bk.id === 'string' && bk.id && !(await dbBookGet(bk.id))) {
          await dbBookPut({ ...bk, name: String(bk.name || 'Buch'), color: BOOK_COLORS[bk.color] ? bk.color : 'blue', created: +bk.created || Date.now() });
          books++;
        }
      } else if (r.k === 'shape') {   // eigene Form: nur neue (unbekannte id) dazunehmen
        const rec = shapeFromBackup(r);
        if (rec && !(await dbShapeGet(rec.id))) { await dbShapePut(rec); shapes++; }
      } else if (r.k === 'note') {
        // Geschrieben wird erst mit der Stricheliste, in einer Transaktion: bricht die Datei ab, bleibt die Seite unverändert
        const { k, ...meta } = r, ex = await dbIndexGet(meta.id);
        if (ex && ex.updated === meta.updated) { noteMap.set(meta.id, { skip: true }); same++; continue; }   // unverändert: Name und Buch hier behalten
        const copy = !!(ex && ex.updated > meta.updated), newId = copy ? uid() : meta.id;
        if (copy) meta.name += ' (Sicherung)';
        if (ex && !copy && !('book' in meta)) meta.book = ex.book;   // ältere Sicherung: die Seite bleibt in ihrem Buch
        meta.id = newId;
        noteMap.set(r.id, { id: newId, copy, meta, replace: !copy, done: false });
      } else if (r.k === 'items') {
        const m = noteMap.get(r.n); if (!m || m.skip || m.done) continue;
        const items = r.items.map(it => ({ ...it, n: m.id, ...(it.t === 's' ? { pts: Float32Array.from(it.pts) } : { img: mapImg(r.n, it.img) }) }));
        await writeRecords(m.meta, items, [], m.replace); m.done = true; count++;
      } else if (r.k === 'img') {
        const m = noteMap.get(r.n); if (!m || m.skip) continue;
        await writeRecords(null, [], [{ id: mapImg(r.n, r.id), n: m.id, blob: dataURLToBlob(r.data), low: null, w: r.w || 0, h: r.h || 0 }], false);
      }
    }
    for (const m of noteMap.values()) if (!m.skip && !m.done && !(await dbIndexGet(m.id))) { await writeRecords(m.meta, [], [], false); count++; }   // Seite ohne Striche
    const extra = [books ? (books === 1 ? '1 neues Buch' : books + ' neue Bücher') : '', shapes ? shapesWord(shapes) : ''].filter(Boolean).join(', ');
    toast((count || !same ? pagesWord(count) + ' wiederhergestellt' : 'Alles war schon da') + (extra ? ' (' + extra + ')' : '') + (same && count ? ', ' + pagesWord(same) + ' unverändert' : ''));
  } catch (err) { toast('Datei konnte nicht geladen werden: ' + err.message, 6000); }
  if (shapes) await loadCustomShapes();
  navBusy = false;
  if (books) homeBook = null;   // neue Bücher stehen im Regal
  renderHome();   // ordnet Seiten ohne Buch (ältere Sicherungen) dem Buch „Meine Notizen“ zu
};
